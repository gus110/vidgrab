<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VidGrab</title>
<style>
  body {
    width: 340px;
    margin: 0;
    padding: 16px;
    background: #141420;
    color: #fff;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 4px;
    background: linear-gradient(135deg, #6C5CE7, #8B7CF6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p { font-size: 12px; color: #8A8AA3; margin: 0 0 12px; }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 8px;
    background: #1E1E2A;
    font-size: 12px;
    margin-bottom: 12px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #E74C3C; flex-shrink: 0; }
  .dot.ok { background: #2ECC71; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .toolbar span { font-size: 12px; font-weight: 600; color: #fff; }
  .toolbar button {
    background: transparent;
    border: none;
    color: #8B7CF6;
    font-size: 11px;
    cursor: pointer;
    padding: 0;
  }

  #list {
    max-height: 260px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
  }
  .video-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #1E1E2A;
    border-radius: 8px;
    padding: 8px 10px;
  }
  .video-item input { flex-shrink: 0; accent-color: #6C5CE7; }
  .video-item .thumb {
    width: 40px;
    height: 40px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
    background: #26263A;
  }
  .video-item .thumb-placeholder {
    width: 40px;
    height: 40px;
    border-radius: 6px;
    background: #26263A;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  .video-item .info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .video-item .badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    background: #26263A;
    color: #8B7CF6;
    flex-shrink: 0;
    width: fit-content;
  }
  .video-item .title {
    font-size: 12px;
    color: #fff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .video-item .url {
    font-size: 10px;
    color: #8A8AA3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .select-actions {
    display: flex;
    gap: 12px;
    margin-bottom: 8px;
  }
  .select-actions button {
    background: transparent;
    border: none;
    color: #8B7CF6;
    font-size: 11px;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
  }
  .empty {
    font-size: 12px;
    color: #8A8AA3;
    text-align: center;
    padding: 20px 0;
  }

  button.primary {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #6C5CE7;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
  }
  button.primary:hover { background: #5849C4; }
  button.primary:disabled { background: #3A3A4E; cursor: not-allowed; }

  .hint { font-size: 11px; color: #8A8AA3; margin-top: 10px; line-height: 1.4; }
</style>
</head>
<body>
  <h1>VidGrab</h1>
  <p>Videos detected on this page</p>
  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Checking desktop app...</span>
  </div>

  <div class="toolbar">
    <span id="countLabel">0 videos found</span>
    <button id="refreshBtn">🔄 Scan again</button>
  </div>

  <div class="select-actions">
    <button id="selectAllBtn">Select all</button>
    <button id="selectNoneBtn">Deselect all</button>
  </div>

  <div id="list">
    <div class="empty">Scanning the page for videos...</div>
  </div>

  <button class="primary" id="sendBtn" disabled>Download selected</button>

  <div class="hint">
    Browse Instagram/TikTok's feed, profile, or reels with the VidGrab app
    open. Every visible video will show up here so you can choose which to download.
  </div>
  <script src="popup.js"></script>
</body>
</html>
